name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile (main + test)
        run: javac -d out $(find app/src -name "*.java")
      - name: Unit tests
        run: java -ea -cp out com.example.tv.network.NetworkClientTest
